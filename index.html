<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animação ITA - Lente e Bloco Refrator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f9;
            margin: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 20px;
            max-width: 850px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #1a237e;
            margin-bottom: 10px;
        }
        p {
            text-align: center;
            color: #555;
            margin-bottom: 15px;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            border: 1px solid #ccc;
            border-radius: 12px;
            background: #fafafa;
        }
        .controls {
            margin-top: 15px;
            text-align: center;
        }
        input[type=range] {
            width: 70%;
            vertical-align: middle;
        }
        .info {
            text-align: center;
            font-size: 1.1rem;
            margin-top: 10px;
            color: #1a237e;
        }
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9rem;
        }
        .color-box {
            width: 18px;
            height: 18px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Animação da Questão do ITA</h1>
    <p>Dois raios paralelos são focados no interior de um bloco transparente.</p>

    <canvas id="canvas" width="800" height="500"></canvas>

    <div class="controls">
        <label for="L">Distância L entre a lente e a superfície do bloco (mm):</label><br>
        <input type="range" id="L" min="0.0" max="1.0" step="0.001" value="0.4226">
        <span id="Lvalue">0.423</span> mm
    </div>

    <div class="info" id="status">
        Os raios se encontram em P? <span id="result">✅</span>
    </div>

    <div class="legend">
        <span class="legend-item"><span class="color-box" style="background:#e53935;"></span> Raio no ar</span>
        <span class="legend-item"><span class="color-box" style="background:#1e88e5;"></span> Raio no bloco</span>
        <span class="legend-item"><span class="color-box" style="background:#43a047;"></span> Eixo óptico</span>
        <span class="legend-item"><span class="color-box" style="background:#ffb300;"></span> Superfície do bloco</span>
        <span class="legend-item"><span class="color-box" style="background:#8e24aa;"></span> Ponto P</span>
    </div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        // Escala: 1 mm = 120 pixels
        const scale = 120;

        // Coordenadas centrais
        const eixoY = height / 2;         // eixo óptico horizontal
        const lenteX = 250;               // posição da lente delgada

        // Distância focal f = 1 mm => 120 pixels
        const f = 1 * scale;              // 120 px

        // Altura dos raios na lente: y0 = 1 mm => 120 px
        const y0 = 1 * scale;             // 120 px

        // Profundidade do ponto P dentro do bloco = 1 mm => 120 px
        const profundidade = 1 * scale;   // 120 px

        // Slider para L (em mm)
        const slider = document.getElementById('L');
        const LvalueSpan = document.getElementById('Lvalue');
        const resultSpan = document.getElementById('result');

        function desenhar() {
            ctx.clearRect(0, 0, width, height);

            // Eixo óptico
            ctx.strokeStyle = '#43a047';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 4]);
            ctx.beginPath();
            ctx.moveTo(0, eixoY);
            ctx.lineTo(width, eixoY);
            ctx.stroke();
            ctx.setLineDash([]);

            // Lente delgada (linha vertical)
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(lenteX, eixoY - 150);
            ctx.lineTo(lenteX, eixoY + 150);
            ctx.stroke();
            ctx.fillStyle = '#333';
            ctx.font = '16px Arial';
            ctx.fillText('Lente', lenteX - 30, eixoY - 130);

            // Foco F'
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(lenteX + f, eixoY, 5, 0, 2 * Math.PI);
            ctx.fill();
            ctx.fillText("F'", lenteX + f - 5, eixoY - 8);

            // Leitura de L (em mm) e conversão para pixels
            const Lmm = parseFloat(slider.value);
            const L = Lmm * scale;  // distância em pixels da lente até a superfície do bloco
            LvalueSpan.textContent = Lmm.toFixed(3);

            // Posição da superfície do bloco
            const blocoX = lenteX + L;

            // Superfície do bloco (linha vertical)
            ctx.strokeStyle = '#ffb300';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(blocoX, eixoY - 200);
            ctx.lineTo(blocoX, eixoY + 200);
            ctx.stroke();
            ctx.fillStyle = '#ffb300';
            ctx.fillText('Superfície', blocoX - 30, eixoY - 160);

            // Cálculo da altura do raio superior na superfície (em pixels)
            // y_s = y0 * (1 - L/f)   (altura acima do eixo)
            const y_s = y0 * (1 - L / f);  // pixels

            // Garantir que y_s seja positivo (L < f)
            if (y_s <= 0) {
                // Se a superfície estiver além do foco, o raio já teria cruzado o eixo; não desenhar bloco
                ctx.fillStyle = '#555';
                ctx.font = '18px Arial';
                ctx.fillText('A superfície deve estar antes do foco.', 300, 80);
                return;
            }

            // Raios no ar (da lente até a superfície)
            // Raio superior (y0 acima do eixo) -> incide na superfície em y_s acima do eixo
            ctx.strokeStyle = '#e53935';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(lenteX, eixoY - y0);
            ctx.lineTo(blocoX, eixoY - y_s);
            ctx.stroke();

            // Raio inferior (y0 abaixo do eixo) -> incide na superfície em y_s abaixo do eixo
            ctx.strokeStyle = '#e53935';
            ctx.beginPath();
            ctx.moveTo(lenteX, eixoY + y0);
            ctx.lineTo(blocoX, eixoY + y_s);
            ctx.stroke();

            // Ângulo de incidência θ (com a horizontal)
            const theta = Math.atan2(y0 - y_s, L);  // radianos
            const thetaDeg = theta * 180 / Math.PI;

            // Lei de Snell: n_ar * sin θ = n_bloco * sin θ'
            const n_ar = 1;
            const n_bloco = Math.sqrt(2);
            const sinTheta = Math.sin(theta);
            const sinThetaPrime = (n_ar / n_bloco) * sinTheta;
            const thetaPrime = Math.asin(sinThetaPrime);
            const thetaPrimeDeg = thetaPrime * 180 / Math.PI;

            // Desenhar raios no bloco (após refração)
            // Para o raio superior: ele desce em direção ao eixo com ângulo θ'
            // A distância horizontal que ele percorre para atingir o eixo é: Δx = y_s / tan θ'
            const deltaX = y_s / Math.tan(thetaPrime);  // pixels

            // Raio superior dentro do bloco
            ctx.strokeStyle = '#1e88e5';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(blocoX, eixoY - y_s);
            ctx.lineTo(blocoX + deltaX, eixoY);
            ctx.stroke();

            // Raio inferior dentro do bloco (simétrico, sobe)
            ctx.strokeStyle = '#1e88e5';
            ctx.beginPath();
            ctx.moveTo(blocoX, eixoY + y_s);
            ctx.lineTo(blocoX + deltaX, eixoY);
            ctx.stroke();

            // Ponto P fixo: a 1 mm (profundidade) dentro do bloco, sobre o eixo
            const Px = blocoX + profundidade;
            const Py = eixoY;

            // Desenhar P
            ctx.fillStyle = '#8e24aa';
            ctx.beginPath();
            ctx.arc(Px, Py, 6, 0, 2 * Math.PI);
            ctx.fill();
            ctx.fillStyle = '#8e24aa';
            ctx.font = '16px Arial';
            ctx.fillText('P', Px + 8, Py - 8);

            // Verificar se os raios atingem P (ou seja, se deltaX ≈ profundidade)
            const tol = 2;  // pixels de tolerância
            const acertou = Math.abs(deltaX - profundidade) < tol;
            resultSpan.textContent = acertou ? '✅ Sim!' : '❌ Não (deslocado)';

            // Desenhar ângulos e informações
            ctx.fillStyle = '#333';
            ctx.font = '14px Arial';
            // θ no ar
            ctx.fillText('θ = ' + thetaDeg.toFixed(1) + '°', lenteX + 20, eixoY - y0 + 15);
            // θ' no bloco
            if (deltaX > 0) {
                ctx.fillText("θ' = " + thetaPrimeDeg.toFixed(1) + '°', blocoX + 20, eixoY - y_s + 15);
            }

            // Linhas tracejadas para indicar triângulos
            ctx.setLineDash([3, 3]);
            ctx.strokeStyle = '#999';
            ctx.lineWidth = 1;
            // triângulo no ar: cateto vertical (y0 - y_s) e horizontal L
            ctx.beginPath();
            ctx.moveTo(lenteX, eixoY - y0);
            ctx.lineTo(lenteX, eixoY - y_s);
            ctx.lineTo(blocoX, eixoY - y_s);
            ctx.closePath();
            ctx.stroke();
            // triângulo no bloco: cateto vertical y_s e horizontal deltaX
            ctx.beginPath();
            ctx.moveTo(blocoX, eixoY - y_s);
            ctx.lineTo(blocoX, eixoY);
            ctx.lineTo(blocoX + deltaX, eixoY);
            ctx.closePath();
            ctx.stroke();
            ctx.setLineDash([]);
        }

        slider.addEventListener('input', desenhar);
        desenhar();
    })();
</script>
</body>
</html>
